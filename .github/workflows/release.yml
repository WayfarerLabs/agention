name: Release

# release-please tags each release when its pull request merges, with its
# GitHub App's token, so the tag push starts this workflow: agention-vX.Y.Z
# for the server line and agention-mcp-vX.Y.Z for the agent line, which the
# first pattern does not match. A repository ruleset lets only that App create
# these tags, and the App's key is a secret of an environment only main may
# use, and main changes only through reviewed pull requests with the required
# check, so such a tag marks a merged release pull request.
on:
  push:
    tags: ["agention-v*", "agention-mcp-v*"]

permissions:
  contents: read

# The line the tag releases, read from its prefix, and the one package that
# line publishes.
env:
  LINE_PREFIX:
    ${{ startsWith(github.ref_name, 'agention-mcp-v') && 'agention-mcp-v' || 'agention-v' }}
  PACKAGE:
    ${{ startsWith(github.ref_name, 'agention-mcp-v') && '@wayfarerlabs/agention-mcp' ||
    '@wayfarerlabs/agention' }}

jobs:
  # Builds and checks both packages, and uploads the tarball of the tag's line
  # it checked for the publish job. It holds no OIDC token, so nothing it runs,
  # the dependencies included, can publish.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      node-version: ${{ steps.node-pin.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No registry-url: it would configure a token, and trusted publishing
      # needs none. A release builds from a clean install, never a cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read the Node.js pin for the publish job
        id: node-pin
        run: echo "node-version=$(tr -d '[:space:]' <.node-version)" >>"$GITHUB_OUTPUT"

      # The tag's line ships its package at the tag's version, and the agent
      # line its plugins too, whose definition's version is the bridge version
      # the committed plugins pin; the Plugin drift gate holds the generated
      # plugins to that definition. Files that ship nothing are not checked.
      - name: Refuse a tag the line's versions do not match
        run: |
          case "$LINE_PREFIX" in
            agention-mcp-v) manifests=(apps/bridge/package.json apps/agent-plugin/plugin.json) ;;
            *) manifests=(apps/server/package.json) ;;
          esac
          for manifest in "${manifests[@]}"; do
            version="$(node -p 'require(process.argv[1]).version' "$PWD/$manifest")"
            if [[ "$version" != "${GITHUB_REF_NAME#"$LINE_PREFIX"}" ]]; then
              echo "::error::$manifest is version $version, which is not the tag $GITHUB_REF_NAME."
              exit 1
            fi
          done

      # Installs the locked dependencies, builds both packages, proves each
      # packed package's command prints its package.json version, which the
      # step above matched to the tag for the line's package, and keeps the
      # tarballs it checked, of which only the line's is uploaded.
      - name: scripts/check.sh --packages
        run: |
          scripts/check.sh --packages "$RUNNER_TEMP/checked"
          # npm packs @scope/name at a version as scope-name-version.tgz.
          mkdir "$RUNNER_TEMP/packages"
          mv "$RUNNER_TEMP/checked/$(tr / - <<<"${PACKAGE#@}")-${GITHUB_REF_NAME#"$LINE_PREFIX"}.tgz" "$RUNNER_TEMP/packages/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error

  # Publishes the build job's tarball to npm through trusted publishing,
  # running no repository code. Each package's trusted publisher names this
  # workflow and the npm environment, which only the two lines' tags may use.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      # npm exchanges the job's OIDC token for a short-lived publish token,
      # and the provenance is signed for the same workflow identity.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      # The tarball is checked to be the line's package at the tag's version
      # before it is published. A version already on npm, published by an
      # earlier run that failed after publishing, is skipped, so a rerun
      # finishes the release; the registry refuses a version twice whatever
      # this check says. --provenance makes a publish that cannot carry
      # provenance fail rather than go out without it.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#"$LINE_PREFIX"}"
          # npm packs @scope/name at a version as scope-name-version.tgz.
          tarball="$RUNNER_TEMP/packages/$(tr / - <<<"${PACKAGE#@}")-$version.tgz"
          packed="$(tar -xzOf "$tarball" package/package.json |
            node -p 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); m.name + "@" + m.version')"
          if [[ "$packed" != "$PACKAGE@$version" ]]; then
            echo "::error::$tarball holds $packed, not $PACKAGE@$version."
            exit 1
          fi
          if npm view "$PACKAGE@$version" version >/dev/null; then
            echo "$PACKAGE@$version is already on npm, so it is skipped."
          else
            npm publish "$tarball" --provenance --ignore-scripts
          fi
