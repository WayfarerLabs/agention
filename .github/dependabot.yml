# Weekly dependency update proposals. Patch and minor updates are grouped per
# ecosystem; major updates arrive as standalone pull requests because they
# usually need review. A release is proposed only once it is seven days old,
# the hold-back CONTRIBUTING.md describes. Commit messages are Conventional
# Commits (chore(deps): ...), which release-please relies on.
version: 2
updates:
  # One lockfile covers the repository tools and every workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-patch-and-minor:
        update-types: [patch, minor]
    ignore:
      # @types/node follows the oldest Node.js line the packages support, 24,
      # so the types refuse an API newer than it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The agent bridge pins these to the versions that @modelcontextprotocol/server
      # carries inlined in its own build, so their license notices ship with the
      # bridge. They move only with that package, and the build names any that
      # falls behind. Ignoring ajv also holds the server's own test pin, which is
      # updated by hand, as CONTRIBUTING.md says.
      - dependency-name: ajv
      - dependency-name: ajv-formats
      - dependency-name: content-type
      - dependency-name: fast-deep-equal
      - dependency-name: fast-uri
      - dependency-name: json-schema-traverse
      # The web UI pins these, which the build's notice check asked for, to the
      # versions that mermaid and @mermaid-js/parser carry inlined in their own
      # builds, so their license notices ship with the diagram frame's script.
      # They move only with those packages, and the build names any that falls
      # behind.
      - dependency-name: fastdom
      - dependency-name: js-yaml
      - dependency-name: langium
      - dependency-name: vscode-languageserver-textdocument
      - dependency-name: vscode-uri

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-patch-and-minor:
        update-types: [patch, minor]
